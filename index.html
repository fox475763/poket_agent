<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POCKET AGENT 결과</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef6f0 0%, #dfece4 100%);
      color: #1f3346;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
    }

    .page-wrap {
      width: min(100%, 430px);
    }

    .result-card {
      width: 100%;
      background: #fffdf3;
      border: 3px solid #1f3346;
      border-radius: 22px;
      padding: 14px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 7px 0 rgba(31, 51, 70, 0.16),
        0 14px 28px rgba(0, 0, 0, 0.14);
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(106, 163, 111, 0.38);
      border-radius: 16px;
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 10px;
    }

    .label {
      display: inline-block;
      margin: 0 0 5px;
      padding: 4px 11px;
      border-radius: 999px;
      background: #e4f3df;
      border: 2px solid #6aa36f;
      color: #477e4c;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.2px;
      line-height: 1.1;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
      color: #1f3346;
      text-shadow: 2px 2px 0 #d6ead6;
    }

    .sub-title {
      margin: 5px 0 0;
      font-size: 12px;
      color: #6b7a70;
      font-weight: 800;
      line-height: 1.25;
    }

    .agent-name-box {
      position: relative;
      z-index: 1;
      margin: 10px 0 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: #1f3346;
      color: #fffdf3;
      text-align: center;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
    }

    .agent-name-label {
      margin: 0 0 2px;
      font-size: 9px;
      letter-spacing: 1.2px;
      color: #b8f0b8;
      font-weight: 900;
    }

    .agent-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      font-weight: 1000;
    }

    .agent-visual {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 1 / 1;
      background:
        radial-gradient(circle at center, rgba(184, 240, 184, 0.45), transparent 58%),
        #f7fbf4;
      border: 3px solid #d6e4d1;
      border-radius: 20px;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .agent {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 0 rgba(31, 51, 70, 0.10));
    }

    .agent-message {
      position: relative;
      z-index: 1;
      margin: 9px 0 0;
      padding: 9px 12px;
      background: #f5f8f2;
      border: 3px solid #d8e5d2;
      border-radius: 16px;
      text-align: center;
      color: #1f3346;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .agent-message span {
      color: #477e4c;
    }

    .middle-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 118px;
      gap: 10px;
      margin-top: 10px;
      align-items: stretch;
    }

    .info {
      background: #f5f8f2;
      border: 3px solid #d8e5d2;
      border-radius: 18px;
      padding: 8px;
      min-width: 0;
    }

    .info-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 7px;
      padding: 7px 4px;
      border-bottom: 2px dashed #d4ded1;
      align-items: start;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info span {
      font-size: 11px;
      color: #6aa36f;
      font-weight: 900;
      line-height: 1.25;
    }

    .info strong {
      font-size: 13px;
      color: #1f3346;
      line-height: 1.3;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .card-section {
      background: #fffaf0;
      border: 3px solid #d8e5d2;
      border-radius: 18px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card-title {
      margin: 0 0 6px;
      color: #477e4c;
      font-size: 10px;
      font-weight: 1000;
      letter-spacing: 0.7px;
      line-height: 1.1;
    }

    .mission-card {
      max-width: 100%;
      max-height: 138px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 0 rgba(31, 51, 70, 0.10));
    }

    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      margin: 9px 0 0;
      color: #7a887e;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      line-height: 1.2;
    }

    .message-box {
      margin-top: 10px;
      background: #1f3346;
      color: #fffdf3;
      border-radius: 15px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
    }

    .save-guide {
      margin: 0;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .quote {
      margin: 4px 0 0;
      color: #b8f0b8;
      font-size: 15px;
      font-weight: 1000;
      line-height: 1.25;
    }

    .download-area {
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }

    .download-button {
      width: min(100%, 320px);
      border: 3px solid #1f3346;
      border-radius: 16px;
      background: #fffdf3;
      color: #1f3346;
      font-size: 15px;
      font-weight: 1000;
      padding: 11px 14px;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(31, 51, 70, 0.28);
    }

    .download-button:active {
      transform: translateY(3px);
      background: #eef4ef;
      box-shadow: 0 2px 0 rgba(31, 51, 70, 0.28);
    }

    .download-hint {
      margin: 7px 0 0;
      text-align: center;
      font-size: 10px;
      color: #5d6d63;
      font-weight: 700;
      line-height: 1.25;
    }

    @media (max-height: 760px) {
      h1 {
        font-size: 23px;
      }

      .agent-name {
        font-size: 17px;
      }

      .agent-message {
        font-size: 12px;
        padding: 8px 10px;
      }

      .mission-card {
        max-height: 110px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 7px;
      }

      .result-card {
        padding: 12px;
      }

      .middle-grid {
        grid-template-columns: 1fr 105px;
        gap: 8px;
      }

      .mission-card {
        max-height: 120px;
      }

      .info-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrap">

    <main id="captureArea" class="result-card">
      <section class="top">
        <p class="label">POCKET AGENT</p>
        <h1>파견 온 요원</h1>
        <p class="sub-title">당신을 도와줄 요원이 도착했습니다</p>
      </section>

      <section class="agent-name-box">
        <p class="agent-name-label">SELECTED AGENT</p>
        <p id="agentText" class="agent-name"></p>
      </section>

      <section class="agent-visual">
        <img id="agentImage" class="agent" src="./images/agents/relax.png" alt="선택한 요원" crossorigin="anonymous" />
      </section>

      <p id="agentMessage" class="agent-message"></p>

      <section class="middle-grid">
        <section class="info">
          <div class="info-row">
            <span>이름</span>
            <strong id="nameText"></strong>
          </div>

          <div class="info-row">
            <span>필요한 도움</span>
            <strong id="helpText"></strong>
          </div>

          <div class="info-row">
            <span>오늘의 카드</span>
            <strong id="cardText"></strong>
          </div>
        </section>

        <section class="card-section">
          <p class="card-title">TODAY CARD</p>
          <img id="cardImage" class="mission-card" src="./images/cards/card1.png" alt="오늘의 카드" crossorigin="anonymous" />
        </section>
      </section>

      <p class="footer">Y-COMPANY · DIGITAL AGENT DISPATCH</p>
    </main>

    <section class="message-box">
      <p class="save-guide">이 화면을 휴대폰에 저장해주세요.</p>
      <p class="quote">“곁에서 도와드릴게요!”</p>
    </section>

    <section class="download-area">
      <button id="downloadButton" class="download-button" type="button">
        이미지로 저장하기
      </button>
    </section>

    <p class="download-hint">
      버튼을 누르면 위 결과 카드만 PNG 이미지로 저장됩니다.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);

    const name = params.get("name") || "이름 없음";
    const help = params.get("help") || "도움 내용 없음";
    const agent = params.get("agent") || "relax";
    const card = params.get("card") || "1";

    const agentNames = {
      relax: "RELAX AGENT",
      relex: "RELAX AGENT",
      cheer: "CHEER AGENT",
      focus: "FOCUS AGENT",
      comfort: "COMFORT AGENT",
      love: "LOVE AGENT"
    };

    const agentLines = {
      relax: [
        "잠깐 쉬어가도 괜찮아요.",
        "오늘은 마음을 천천히 내려놓아요.",
        "숨을 고르면 다시 나아갈 수 있어요.",
        "조용히 곁에서 지켜드릴게요.",
        "무리하지 않아도 충분히 잘하고 있어요."
      ],
      relex: [
        "잠깐 쉬어가도 괜찮아요.",
        "오늘은 마음을 천천히 내려놓아요.",
        "숨을 고르면 다시 나아갈 수 있어요.",
        "조용히 곁에서 지켜드릴게요.",
        "무리하지 않아도 충분히 잘하고 있어요."
      ],
      cheer: [
        "오늘도 충분히 해낼 수 있어요!",
        "작은 한 걸음도 멋진 출발이에요.",
        "힘이 필요할 때 제가 응원할게요!",
        "지금의 용기가 분명 빛날 거예요.",
        "조금만 더, 함께 힘내봐요!"
      ],
      focus: [
        "지금 해야 할 일 하나에만 집중해봐요.",
        "복잡한 생각은 잠시 정리해드릴게요.",
        "차분히 하나씩 해결하면 괜찮아요.",
        "흐트러진 마음을 다시 모아봐요.",
        "중요한 것부터 천천히 잡아드릴게요."
      ],
      comfort: [
        "괜찮아요, 지금 마음도 소중해요.",
        "말하지 않아도 충분히 이해하고 있어요.",
        "오늘은 스스로를 조금 더 안아주세요.",
        "힘든 마음을 혼자 두지 않을게요.",
        "따뜻한 위로가 필요할 때 곁에 있을게요."
      ],
      love: [
        "당신의 마음은 충분히 소중해요.",
        "오늘도 다정한 마음을 잊지 말아요.",
        "사랑받을 준비는 이미 되어 있어요.",
        "마음이 닿는 순간을 함께 지켜볼게요.",
        "따뜻한 연결이 곧 찾아올 거예요."
      ]
    };

    const agentKey = agent.toLowerCase();
    const lineList = agentLines[agentKey] || agentLines.relax;
    const randomLine = lineList[Math.floor(Math.random() * lineList.length)];

    document.getElementById("nameText").textContent = name;
    document.getElementById("helpText").textContent = help;
    document.getElementById("agentText").textContent = agentNames[agentKey] || agent;
    document.getElementById("cardText").textContent = "CARD " + card;

    document.getElementById("agentMessage").innerHTML =
      "<span>" + name + "님,</span> " + randomLine;

    const agentImage = document.getElementById("agentImage");
    const cardImage = document.getElementById("cardImage");

    agentImage.src = "./images/agents/" + agentKey + ".png";
    cardImage.src = "./images/cards/card" + card + ".png";

    agentImage.onerror = function () {
      agentImage.src = "./images/agents/relax.png";
    };

    cardImage.onerror = function () {
      cardImage.src = "./images/cards/card1.png";
    };

    function waitForImages() {
      const images = document.querySelectorAll("#captureArea img");

      const promises = Array.from(images).map(function (img) {
        if (img.complete && img.naturalWidth > 0) {
          return Promise.resolve();
        }

        return new Promise(function (resolve) {
          img.onload = resolve;
          img.onerror = resolve;
        });
      });

      return Promise.all(promises);
    }

    document.getElementById("downloadButton").addEventListener("click", async function () {
      const captureArea = document.getElementById("captureArea");
      const button = document.getElementById("downloadButton");

      button.textContent = "저장 준비 중...";
      button.disabled = true;

      await waitForImages();

      html2canvas(captureArea, {
        backgroundColor: "#fffdf3",
        scale: 3,
        useCORS: true,
        allowTaint: false,
        scrollX: 0,
        scrollY: 0,
        width: captureArea.offsetWidth,
        height: captureArea.offsetHeight,
        windowWidth: document.documentElement.clientWidth,
        windowHeight: document.documentElement.clientHeight
      }).then(function (canvas) {
        const link = document.createElement("a");
        const safeName = name.replace(/[\\/:*?"<>|]/g, "");

        link.download = "pocket-agent-" + safeName + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();

        button.textContent = "이미지로 저장하기";
        button.disabled = false;
      }).catch(function () {
        alert("이미지 저장에 실패했어요. 화면 캡처로 저장해주세요.");
        button.textContent = "이미지로 저장하기";
        button.disabled = false;
      });
    });
  </script>
</body>
</html>
