<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POCKET AGENT 결과</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(162, 221, 170, 0.35), transparent 35%),
        linear-gradient(180deg, #eef6f0 0%, #dfece4 100%);
      color: #1f3346;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px;
    }

    .page-wrap {
      width: min(100%, 560px);
    }

    .result-card {
      width: 100%;
      background: #fffdf3;
      border: 4px solid #1f3346;
      border-radius: 30px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 12px 0 rgba(31, 51, 70, 0.18),
        0 20px 45px rgba(0, 0, 0, 0.18);
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 11px;
      border: 2px dashed rgba(106, 163, 111, 0.45);
      border-radius: 23px;
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 18px;
    }

    .label {
      display: inline-block;
      margin: 0 0 8px;
      padding: 6px 15px;
      border-radius: 999px;
      background: #e4f3df;
      border: 2px solid #6aa36f;
      color: #477e4c;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      color: #1f3346;
      text-shadow: 2px 2px 0 #d6ead6;
    }

    .sub-title {
      margin: 8px 0 0;
      font-size: 14px;
      color: #6b7a70;
      font-weight: 800;
      line-height: 1.45;
    }

    .agent-name-box {
      position: relative;
      z-index: 1;
      margin: 18px 0 14px;
      padding: 12px 14px;
      border-radius: 18px;
      background: #1f3346;
      color: #fffdf3;
      text-align: center;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18);
    }

    .agent-name-label {
      margin: 0 0 4px;
      font-size: 11px;
      letter-spacing: 1.4px;
      color: #b8f0b8;
      font-weight: 900;
    }

    .agent-name {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 1000;
    }

    .agent-visual {
      position: relative;
      z-index: 1;
      width: 100%;
      background:
        radial-gradient(circle at center, rgba(184, 240, 184, 0.55), transparent 60%),
        #f7fbf4;
      border: 3px solid #d6e4d1;
      border-radius: 26px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 420px;
      overflow: hidden;
    }

    .agent-visual::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(126, 211, 111, 0.25);
      filter: blur(10px);
      z-index: 0;
    }

    .agent {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 12px 0 rgba(31, 51, 70, 0.12));
    }

    .info {
      position: relative;
      z-index: 1;
      background: #f5f8f2;
      border: 3px solid #d8e5d2;
      border-radius: 22px;
      padding: 14px;
      margin-top: 18px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 95px 1fr;
      gap: 10px;
      padding: 12px 8px;
      border-bottom: 2px dashed #d4ded1;
      align-items: start;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info span {
      font-size: 13px;
      color: #6aa36f;
      font-weight: 900;
      line-height: 1.4;
    }

    .info strong {
      font-size: 17px;
      color: #1f3346;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .card-section {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      background: #fffaf0;
      border: 3px solid #d8e5d2;
      border-radius: 24px;
      padding: 16px;
      text-align: center;
    }

    .card-title {
      margin: 0 0 12px;
      color: #477e4c;
      font-size: 14px;
      font-weight: 1000;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .mission-card {
      width: min(78%, 340px);
      max-height: 420px;
      object-fit: contain;
      filter: drop-shadow(0 10px 0 rgba(31, 51, 70, 0.12));
    }

    .message-box {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      background: #1f3346;
      color: #fffdf3;
      border-radius: 18px;
      padding: 16px 14px;
      text-align: center;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18);
    }

    .save-guide {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.6;
    }

    .quote {
      margin: 6px 0 0;
      color: #b8f0b8;
      font-size: 18px;
      font-weight: 1000;
      line-height: 1.4;
    }

    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 14px;
      color: #7a887e;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }

    .download-area {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }

    .download-button {
      width: min(100%, 360px);
      border: 3px solid #1f3346;
      border-radius: 18px;
      background: #fffdf3;
      color: #1f3346;
      font-size: 17px;
      font-weight: 1000;
      padding: 14px 18px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(31, 51, 70, 0.28);
    }

    .download-button:active {
      transform: translateY(4px);
      background: #eef4ef;
      box-shadow: 0 2px 0 rgba(31, 51, 70, 0.28);
    }

    .download-hint {
      margin: 10px 0 0;
      text-align: center;
      font-size: 12px;
      color: #5d6d63;
      font-weight: 700;
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .result-card {
        padding: 18px;
        border-radius: 25px;
      }

      h1 {
        font-size: 30px;
      }

      .agent-name {
        font-size: 22px;
      }

      .agent-visual {
        min-height: 330px;
        padding: 10px;
      }

      .agent {
        max-width: 330px;
      }

      .info-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .mission-card {
        width: min(90%, 300px);
        max-height: 360px;
      }
    }

    @media (min-width: 900px) {
      body {
        align-items: center;
      }

      .page-wrap {
        width: min(96vw, 900px);
      }

      .result-card {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 20px;
        padding: 26px;
      }

      .top,
      .message-box,
      .footer {
        grid-column: 1 / 3;
      }

      .agent-name-box {
        grid-column: 1 / 2;
        margin: 0;
      }

      .agent-visual {
        grid-column: 1 / 2;
        min-height: 500px;
      }

      .info {
        grid-column: 2 / 3;
        grid-row: 2 / 4;
        margin-top: 0;
        align-self: start;
      }

      .card-section {
        grid-column: 2 / 3;
        margin-top: 0;
        align-self: end;
      }

      .agent {
        max-width: 500px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrap">
    <main id="captureArea" class="result-card">
      <section class="top">
        <p class="label">POCKET AGENT</p>
        <h1>파견 온 요원</h1>
        <p class="sub-title">당신을 도와줄 요원이 도착했습니다</p>
      </section>

      <section class="agent-name-box">
        <p class="agent-name-label">SELECTED AGENT</p>
        <p id="agentText" class="agent-name"></p>
      </section>

      <section class="agent-visual">
        <img id="agentImage" class="agent" src="./images/agents/relax.png" alt="선택한 요원" />
      </section>

      <section class="info">
        <div class="info-row">
          <span>이름</span>
          <strong id="nameText"></strong>
        </div>

        <div class="info-row">
          <span>필요한 도움</span>
          <strong id="helpText"></strong>
        </div>

        <div class="info-row">
          <span>오늘의 카드</span>
          <strong id="cardText"></strong>
        </div>
      </section>

      <section class="card-section">
        <p class="card-title">TODAY CARD</p>
        <img id="cardImage" class="mission-card" src="./images/cards/card1.png" alt="오늘의 카드" />
      </section>

      <section class="message-box">
        <p class="save-guide">이 화면을 휴대폰에 저장해주세요.</p>
        <p class="quote">“곁에서 도와드릴게요!”</p>
      </section>

      <p class="footer">Y-COMPANY · DIGITAL AGENT DISPATCH</p>
    </main>

    <section class="download-area">
      <button id="downloadButton" class="download-button" type="button">
        이미지로 저장하기
      </button>
    </section>

    <p class="download-hint">
      버튼을 누르면 현재 결과 카드가 PNG 이미지로 저장됩니다.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);

    const name = params.get("name") || "이름 없음";
    const help = params.get("help") || "도움 내용 없음";
    const agent = params.get("agent") || "relax";
    const card = params.get("card") || "1";

    const agentNames = {
      relax: "RELAX AGENT",
      relex: "RELAX AGENT",
      cheer: "CHEER AGENT",
      focus: "FOCUS AGENT",
      comfort: "COMFORT AGENT",
      love: "LOVE AGENT"
    };

    document.getElementById("nameText").textContent = name;
    document.getElementById("helpText").textContent = help;
    document.getElementById("agentText").textContent = agentNames[agent] || agent;
    document.getElementById("cardText").textContent = "CARD " + card;

    const agentImage = document.getElementById("agentImage");
    const cardImage = document.getElementById("cardImage");

    agentImage.src = "./images/agents/" + agent + ".png";
    cardImage.src = "./images/cards/card" + card + ".png";

    agentImage.onerror = function () {
      agentImage.src = "./images/agents/relax.png";
    };

    cardImage.onerror = function () {
      cardImage.src = "./images/cards/card1.png";
    };

    function waitForImages() {
      const images = document.querySelectorAll("#captureArea img");

      const promises = Array.from(images).map(function (img) {
        if (img.complete) {
          return Promise.resolve();
        }

        return new Promise(function (resolve) {
          img.onload = resolve;
          img.onerror = resolve;
        });
      });

      return Promise.all(promises);
    }

    document.getElementById("downloadButton").addEventListener("click", async function () {
      const captureArea = document.getElementById("captureArea");
      const button = document.getElementById("downloadButton");

      button.textContent = "저장 준비 중...";
      button.disabled = true;

      await waitForImages();

      html2canvas(captureArea, {
        backgroundColor: null,
        scale: 2,
        useCORS: true
      }).then(function (canvas) {
        const link = document.createElement("a");
        link.download = "pocket-agent-result.png";
        link.href = canvas.toDataURL("image/png");
        link.click();

        button.textContent = "이미지로 저장하기";
        button.disabled = false;
      }).catch(function () {
        alert("이미지 저장에 실패했어요. 화면 캡처로 저장해주세요.");
        button.textContent = "이미지로 저장하기";
        button.disabled = false;
      });
    });
  </script>
</body>
</html>
